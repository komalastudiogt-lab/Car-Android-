<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Car APK Manager</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--tx:#eef1f6;--mut:#8b93a3;--ac:#4f8cff;--ok:#2ecc71;--bad:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.35 sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:14px 18px;font-weight:700;font-size:22px;border-bottom:1px solid var(--line)}
nav{display:flex;gap:8px;padding:10px 12px}
nav button{flex:1;padding:14px;border:0;border-radius:12px;background:var(--card);color:var(--mut);font-size:18px;font-weight:600}
nav button.on{background:var(--ac);color:#fff}
main{flex:1;overflow:auto;padding:0 12px 16px}
.sec{display:none}.sec.on{display:block}
.btn{display:block;width:100%;padding:16px;margin:8px 0;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:18px;font-weight:600}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok);color:#06210f}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.row b{display:block}.row small{color:var(--mut);word-break:break-all}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts .btn{flex:1;min-width:120px;margin:0;padding:12px}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:18px;margin:8px 0}
.mut{color:var(--mut)}label{display:block;margin:6px 0}
</style></head><body>
<header>🚗 Car APK Manager</header>
<nav>
  <button data-t="inst" class="on">Instalar</button>
  <button data-t="apps">Mis apps</button>
  <button data-t="cfg">Ajustes</button>
</nav>
<main>
  <section id="inst" class="sec on">
    <button class="btn" id="scan">🔍 Buscar APK (USB / almacenamiento)</button>
    <button class="btn g" id="pick">📂 Elegir archivo APK</button>
    <div id="sel"></div>
    <div id="found"></div>
  </section>
  <section id="apps" class="sec">
    <input type="text" id="q" placeholder="Buscar app…">
    <label><input type="checkbox" id="sys"> Mostrar apps del sistema</label>
    <div id="list"></div>
  </section>
  <section id="cfg" class="sec">
    <button class="btn g" data-s="unknown">🔓 Permitir instalar apps desconocidas</button>
    <button class="btn g" data-s="home">🏠 Elegir launcher / pantalla de inicio</button>
    <button class="btn g" data-s="apps">📦 Administrador de apps del sistema</button>
    <button class="btn g" data-s="main">⚙️ Ajustes de Android</button>
  </section>
</main>
<script>
const N=window.Native||{getApps:()=>"[]",scanApks(){setTimeout(()=>onScan([]),300)},pickApk(){},selectApk:()=>"{}",install(){},openApp(){},uninstall(){},appInfo(){},shareApk(){},settings(){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let apps=[],open=-1,found=[];
function tab(t){
  document.querySelectorAll('.sec').forEach(e=>e.classList.toggle('on',e.id==t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
  if(t=='apps')loadApps();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>N.settings(b.dataset.s));
$('#pick').onclick=()=>N.pickApk();
$('#scan').onclick=()=>{$('#found').innerHTML='<p class="mut">Buscando…</p>';N.scanApks()};
function onPerm(){N.scanApks()}
function onScan(l){
  found=l;
  $('#found').innerHTML=l.length?l.map((f,i)=>`<div class="row" data-i="${i}"><b>${esc(f.n)}</b><small>${esc(f.p)} · ${(f.s/1048576).toFixed(1)} MB</small></div>`).join(''):'<p class="mut">No se encontraron APK.</p>';
  document.querySelectorAll('#found .row').forEach(r=>r.onclick=()=>onPicked(JSON.parse(N.selectApk(found[r.dataset.i].p))));
}
function onPicked(i){
  if(i.err){$('#sel').innerHTML=`<div class="row"><b style="color:var(--bad)">${esc(i.err)}</b></div>`;return}
  const note=i.old?`Actualiza: ${esc(i.old)} → ${esc(i.v)}`:'Instalación nueva';
  $('#sel').innerHTML=`<div class="row"><b>${esc(i.n)}</b><small>${esc(i.p)} · v${esc(i.v)}<br>${note}</small><div class="acts"><button class="btn ok" id="go">⬇ Instalar ahora</button></div></div>`;
  $('#go').onclick=()=>N.install();
  window.scrollTo(0,0);
}
function loadApps(){
  apps=JSON.parse(N.getApps($('#sys').checked)).sort((a,b)=>a.n.localeCompare(b.n));
  open=-1;render();
}
function render(){
  const q=$('#q').value.toLowerCase();
  $('#list').innerHTML=apps.map((a,i)=>({a,i})).filter(x=>(x.a.n+x.a.p).toLowerCase().includes(q)).map(({a,i})=>
   `<div class="row" data-i="${i}"><b>${esc(a.n)}</b><small>${esc(a.p)} · v${esc(a.v)}</small>`+
   (open==i?`<div class="acts">${a.l?'<button class="btn" data-a="openApp">Abrir</button>':''}<button class="btn g" data-a="appInfo">Info / Permisos</button><button class="btn g" data-a="shareApk">Exportar APK</button><button class="btn bad" data-a="uninstall">Desinstalar</button></div>`:'')+`</div>`).join('')||'<p class="mut">Sin resultados.</p>';
  document.querySelectorAll('#list .row').forEach(r=>r.onclick=e=>{
    const b=e.target.closest('[data-a]');
    if(b){N[b.dataset.a](apps[r.dataset.i].p);return}
    open=open==r.dataset.i?-1:+r.dataset.i;render();
  });
}
$('#q').oninput=render;$('#sys').onchange=loadApps;
</script></body></html>
